name: Publish GitHub release from approved tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tag/version alignment
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Require approved Apache-2.0 licensing and GitHub-only distribution
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE && test -s NOTICE.md || { echo "LICENSE or NOTICE.md is missing" >&2; exit 1; }
          node -e 'const fs=require("node:fs"); const p=require("./package.json"); const l=require("./package-lock.json"); const license=fs.readFileSync("LICENSE","utf8"); if(p.license!=="Apache-2.0" || l.packages[""].license!=="Apache-2.0" || p.private!==true || !license.startsWith("Apache License\nVersion 2.0, January 2004")){console.error("Apache-2.0 metadata or npm publication protection is missing"); process.exit(1)}'
      - name: Require tag commit to be present on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release tag must point to a commit reachable from main" >&2; exit 1; }
      - name: Test checked-out tag
        run: |
          npm ci --ignore-scripts
          npm run test:all
          npm run smoke
      - name: Build local install artifact (no npm publishing)
        shell: bash
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts --ignore-scripts
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz --prerelease --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
