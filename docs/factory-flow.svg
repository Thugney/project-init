<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="t d">
<title id="t">Project Init Factory flow</title>
<desc id="d">Project Init bootstraps Spec Kit and ECC for both Codex and Claude, then installs the Factory. The Factory spec-writer decomposes approved work into independent [CODEX] and [CLAUDE] tasks by dependency and file boundaries. Codex and Claude run in parallel in isolated Git worktrees. Both worker branches merge into an integration worktree, which is tested and reviewed by four reviewers. Findings route back to the owning worker for up to two fix rounds. The approver writes a decision; a PR from the integration branch waits for human approval.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa6c1"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9822f"/></marker>
</defs>
<g font-family="Segoe UI,Arial,sans-serif">
<rect width="1400" height="1060" rx="26" fill="#f6f8fc"/>
<rect x="26" y="26" width="1348" height="1008" rx="20" fill="#ffffff" stroke="#d9e2ef"/>
<text x="70" y="82" font-size="32" font-weight="700" fill="#182d4d">Factory: parallel Codex + Claude in isolated worktrees</text>
<text x="70" y="113" font-size="16" fill="#53677f">One bootstrap · One spec owner · Two parallel workers · One integration branch · Human approval</text>

<!-- Project Init -->
<rect x="450" y="140" width="500" height="70" rx="14" fill="#eaf2ff" stroke="#bbd1f0" stroke-width="1.5"/>
<text x="700" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#234f88">Project Init</text>
<text x="700" y="196" text-anchor="middle" font-size="15" fill="#3b658f">init · update · install · wire  (preview, then --apply)</text>

<line x1="580" y1="210" x2="390" y2="246" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="820" y1="210" x2="1010" y2="246" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="700" y1="210" x2="700" y2="352" stroke="#8fa6c1" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>

<!-- Spec Kit / ECC -->
<rect x="150" y="250" width="420" height="78" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="150" y="250" width="8" height="78" rx="4" fill="#5769d2"/>
<text x="178" y="280" font-size="20" font-weight="700" fill="#182d4d">Spec Kit</text>
<text x="178" y="305" font-size="14" fill="#526986">Single spec owner · specs/NNN-x/ · Codex + Claude integration</text>

<rect x="830" y="250" width="420" height="78" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="830" y="250" width="8" height="78" rx="4" fill="#287b92"/>
<text x="858" y="280" font-size="20" font-weight="700" fill="#182d4d">ECC</text>
<text x="858" y="305" font-size="14" fill="#526986">Engineering / security / testing toolbox · Codex + Claude</text>

<line x1="360" y1="328" x2="560" y2="358" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="328" x2="840" y2="358" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>

<!-- Decomposition -->
<rect x="360" y="360" width="680" height="88" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="360" y="360" width="8" height="88" rx="4" fill="#306dcc"/>
<text x="388" y="390" font-size="20" font-weight="700" fill="#182d4d">/factory → factory-spec-writer · task decomposition</text>
<text x="388" y="414" font-size="14" fill="#526986">Writes factory/jobs/&lt;slug&gt;/spec.md. Tags tasks [CODEX] / [CLAUDE] by dependency</text>
<text x="388" y="434" font-size="14" fill="#526986">and file boundaries, balanced for parallelism — not frontend/backend roles.</text>

<line x1="560" y1="448" x2="380" y2="496" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="840" y1="448" x2="1020" y2="496" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="700" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7e93">worktree.py init · both start in parallel</text>

<!-- Worktrees -->
<rect x="130" y="500" width="500" height="118" rx="16" fill="#e8f7f1" stroke="#baded1" stroke-width="1.5"/>
<text x="156" y="532" font-size="13" font-weight="700" fill="#17634b">WORKTREE A · isolated · factory/&lt;slug&gt;/codex</text>
<text x="156" y="564" font-size="21" font-weight="700" fill="#182d4d">Codex</text>
<text x="156" y="588" font-size="14" fill="#376d5e">codex_worker.py → codex exec · factory-worker skill</text>
<text x="156" y="607" font-size="14" fill="#376d5e">Implements [CODEX] tasks · resumed for fixes</text>

<rect x="770" y="500" width="500" height="118" rx="16" fill="#efeafd" stroke="#d2c6f3" stroke-width="1.5"/>
<text x="796" y="532" font-size="13" font-weight="700" fill="#5a3fa3">WORKTREE B · isolated · factory/&lt;slug&gt;/claude</text>
<text x="796" y="564" font-size="21" font-weight="700" fill="#182d4d">Claude</text>
<text x="796" y="588" font-size="14" fill="#5d4d86">factory-builder agent (Opus)</text>
<text x="796" y="607" font-size="14" fill="#5d4d86">Implements [CLAUDE] tasks · resumed for fixes</text>

<line x1="380" y1="618" x2="580" y2="666" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1020" y1="618" x2="820" y2="666" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="700" y="652" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7e93">worktree.py integrate · conflict = stop</text>

<!-- Integration -->
<rect x="400" y="670" width="600" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="400" y="670" width="8" height="72" rx="4" fill="#217c60"/>
<text x="428" y="700" font-size="20" font-weight="700" fill="#182d4d">Integration worktree · factory/&lt;slug&gt;/integration</text>
<text x="428" y="724" font-size="14" fill="#526986">Configured tests run here · the only branch reviewed and shipped</text>

<line x1="700" y1="742" x2="700" y2="770" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>

<!-- Reviews -->
<rect x="330" y="774" width="740" height="88" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="330" y="774" width="8" height="88" rx="4" fill="#93652b"/>
<text x="358" y="804" font-size="20" font-weight="700" fill="#182d4d">Reviews in parallel (Opus) · WAIT FOR ALL</text>
<text x="358" y="828" font-size="14" fill="#526986">security · code · ux · ui  (ux/ui skipped when has_ui=false)</text>
<text x="358" y="848" font-size="14" fill="#526986">Findings tagged [CODEX] / [CLAUDE] / [INTEGRATION]</text>

<!-- Fix loop -->
<path d="M 330 818 C 70 818 70 560 124 560" fill="none" stroke="#c9822f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<path d="M 1070 818 C 1330 818 1330 560 1276 560" fill="none" stroke="#c9822f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="128" y="690" font-size="13" font-weight="700" fill="#9a5f1c">[CODEX] fixes</text>
<text x="128" y="708" font-size="12" fill="#9a5f1c">sync → fix → re-integrate</text>
<text x="1272" y="690" text-anchor="end" font-size="13" font-weight="700" fill="#9a5f1c">[CLAUDE] fixes</text>
<text x="1272" y="708" text-anchor="end" font-size="12" fill="#9a5f1c">max 2 rounds</text>

<line x1="700" y1="862" x2="700" y2="890" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>

<!-- Decision -->
<rect x="250" y="894" width="560" height="96" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="250" y="894" width="8" height="96" rx="4" fill="#5769d2"/>
<text x="278" y="924" font-size="20" font-weight="700" fill="#182d4d">factory-approver → decision.md</text>
<text x="278" y="948" font-size="14" fill="#526986">APPROVE + LOW risk + all PASS → PR from integration branch</text>
<text x="278" y="970" font-size="14" fill="#526986">Otherwise needs-human · risk tier computed from changed paths</text>

<line x1="810" y1="942" x2="866" y2="942" stroke="#8fa6c1" stroke-width="2.5" marker-end="url(#a)"/>

<rect x="870" y="894" width="400" height="96" rx="16" fill="#fff6e8" stroke="#f1d6a7" stroke-width="1.5"/>
<text x="896" y="928" font-size="20" font-weight="700" fill="#7a5019">Human approval</text>
<text x="896" y="952" font-size="14" fill="#855f2b">/factory approve &lt;slug&gt; · branch protection + CI</text>
<text x="896" y="974" font-size="14" fill="#855f2b">Never pushes base branch · never force-pushes</text>

<text x="70" y="1016" font-size="13" fill="#6b7e93">Codex factory-audit (read-only audit of the integration worktree) is installed but not called by /factory; run it manually in Codex. Job state: factory/board.json + dashboard.html.</text>
</g>
</svg>
