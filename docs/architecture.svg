<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="t d">
<title id="t">Project Init workflow and ownership</title>
<desc id="d">Six explicit stages: Project Init discovery; native framework specification; high-fidelity design approval; Codex or Claude implementation; Project Init verification and drift controls; human release approval. Lean Kit and audit evidence support the lifecycle.</desc>
<rect width="1400" height="790" rx="26" fill="#f6f8fc"/>
<rect x="26" y="26" width="1348" height="738" rx="20" fill="#ffffff" stroke="#d9e2ef"/>
<text x="70" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#182d4d">From requirements to verified change</text>
<text x="70" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#53677f">One orchestrator · One native framework · Actual coding · Evidence-based human release</text>
<text x="1070" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#456382">CROSS-CUTTING CONTROLS</text>
<line x1="99" y1="221" x2="99" y2="246" stroke="#b8c9dc" stroke-width="3"/>
<path d="M 92 239 L 99 247 L 106 239" fill="none" stroke="#b8c9dc" stroke-width="3" stroke-linecap="round"/>
<rect x="70" y="155" width="920" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="70" y="155" width="8" height="72" rx="4" fill="#306dcc"/>
<circle cx="102" cy="191" r="19" fill="#306dcc"/>
<text x="102" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">01</text>
<text x="136" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#182d4d">Discover</text>
<text x="136" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526986">Read existing code, tests and constraints. Rank framework choices.</text>
<rect x="746" y="168" width="220" height="23" rx="11" fill="#e9f0fa"/>
<text x="856" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#315682">Project Init</text>
<line x1="99" y1="314" x2="99" y2="339" stroke="#b8c9dc" stroke-width="3"/>
<path d="M 92 332 L 99 340 L 106 332" fill="none" stroke="#b8c9dc" stroke-width="3" stroke-linecap="round"/>
<rect x="70" y="248" width="920" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="70" y="248" width="8" height="72" rx="4" fill="#5769d2"/>
<circle cx="102" cy="284" r="19" fill="#5769d2"/>
<text x="102" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">02</text>
<text x="136" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#182d4d">Specify and plan</text>
<text x="136" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526986">OpenSpec / Spec Kit / BMAD / none owns requirements and tasks.</text>
<rect x="746" y="261" width="220" height="23" rx="11" fill="#e9f0fa"/>
<text x="856" y="277" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#315682">Selected native framework</text>
<line x1="99" y1="407" x2="99" y2="432" stroke="#b8c9dc" stroke-width="3"/>
<path d="M 92 425 L 99 433 L 106 425" fill="none" stroke="#b8c9dc" stroke-width="3" stroke-linecap="round"/>
<rect x="70" y="341" width="920" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="70" y="341" width="8" height="72" rx="4" fill="#287b92"/>
<circle cx="102" cy="377" r="19" fill="#287b92"/>
<text x="102" y="382" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">03</text>
<text x="136" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#182d4d">Visual review and approval</text>
<text x="136" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526986">Review realistic UI mockups and pin approved artifact hashes.</text>
<rect x="746" y="354" width="220" height="23" rx="11" fill="#e9f0fa"/>
<text x="856" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#315682">Project Init + maintainer</text>
<line x1="99" y1="500" x2="99" y2="525" stroke="#b8c9dc" stroke-width="3"/>
<path d="M 92 518 L 99 526 L 106 518" fill="none" stroke="#b8c9dc" stroke-width="3" stroke-linecap="round"/>
<rect x="70" y="434" width="920" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="70" y="434" width="8" height="72" rx="4" fill="#217c60"/>
<circle cx="102" cy="470" r="19" fill="#217c60"/>
<text x="102" y="475" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">04</text>
<text x="136" y="461" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#182d4d">Implement</text>
<text x="136" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526986">Agent writes actual code and tests from approved native tasks.</text>
<rect x="746" y="447" width="220" height="23" rx="11" fill="#e9f0fa"/>
<text x="856" y="463" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#315682">Codex or Claude Code</text>
<line x1="99" y1="593" x2="99" y2="618" stroke="#b8c9dc" stroke-width="3"/>
<path d="M 92 611 L 99 619 L 106 611" fill="none" stroke="#b8c9dc" stroke-width="3" stroke-linecap="round"/>
<rect x="70" y="527" width="920" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="70" y="527" width="8" height="72" rx="4" fill="#93652b"/>
<circle cx="102" cy="563" r="19" fill="#93652b"/>
<text x="102" y="568" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">05</text>
<text x="136" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#182d4d">Verify and detect drift</text>
<text x="136" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526986">Run real checks, compare screenshots, demand review evidence.</text>
<rect x="746" y="540" width="220" height="23" rx="11" fill="#e9f0fa"/>
<text x="856" y="556" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#315682">Project Init + test runner</text>
<rect x="70" y="620" width="920" height="72" rx="14" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/>
<rect x="70" y="620" width="8" height="72" rx="4" fill="#4d657e"/>
<circle cx="102" cy="656" r="19" fill="#4d657e"/>
<text x="102" y="661" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">06</text>
<text x="136" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#182d4d">Release decision</text>
<text x="136" y="671" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526986">Review candidate and CI evidence; approve merge/release separately.</text>
<rect x="746" y="633" width="220" height="23" rx="11" fill="#e9f0fa"/>
<text x="856" y="649" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#315682">Human maintainer</text>
<rect x="1042" y="188" width="275" height="124" rx="16" fill="#eaf2ff" stroke="#bbd1f0"/>
<text x="1064" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#234f88">Lean Kit</text>
<text x="1064" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#3b658f">Offline readable reports</text>
<text x="1064" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#3b658f">No separate installation</text>
<rect x="1042" y="330" width="275" height="160" rx="16" fill="#e8f7f1" stroke="#baded1"/>
<text x="1064" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17634b">AI Drift Guard</text>
<text x="1064" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#376d5e">Current spec references</text>
<text x="1064" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#376d5e">Source / test receipts</text>
<text x="1064" y="439" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#376d5e">Visual comparison</text>
<text x="1064" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#376d5e">Independent review input</text>
<rect x="1042" y="508" width="275" height="139" rx="16" fill="#fff6e8" stroke="#f1d6a7"/>
<text x="1064" y="545" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#7a5019">Safety boundaries</text>
<text x="1064" y="572" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#855f2b">No invented approvals</text>
<text x="1064" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#855f2b">No automatic releases</text>
<text x="1064" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#855f2b">Review before install</text>
<text x="70" y="749" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7e93">Preview implementation: framework installation and client discovery require real-machine validation; guard PASS means candidate only.</text>
</svg>