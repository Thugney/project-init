<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter</title>
<script>
// Presentation only: query parameters select the static design variant.
const query = new URLSearchParams(location.search);
const theme = query.get('theme');
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
document.documentElement.dataset.state = query.get('state') === 'Empty' || query.get('capture') === 'Empty' ? 'Empty' : 'Default';
</script>
<style>
:root{color-scheme:light;--background:#f5f6f8;--surface:#ffffff;--text:#182230;--muted:#4b596b;--border:#7b8797;--primary:#2459a9;--primary-text:#ffffff;--hover:#194581;--focus:#2459a9;--soft:#edf2f8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--background:#111820;--surface:#1b2531;--text:#f3f6fa;--muted:#bac6d5;--border:#7c8da3;--primary:#a8caff;--primary-text:#10233f;--hover:#c4dbff;--focus:#a8caff;--soft:#263447}}
:root[data-theme="dark"]{color-scheme:dark;--background:#111820;--surface:#1b2531;--text:#f3f6fa;--muted:#bac6d5;--border:#7c8da3;--primary:#a8caff;--primary-text:#10233f;--hover:#c4dbff;--focus:#a8caff;--soft:#263447}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font-size:16px;line-height:1.5}main{width:min(100%,528px);margin:0 auto;padding:64px 24px}nav{margin-bottom:24px}nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;background:var(--soft);color:var(--text);font-size:14px;font-weight:600;text-decoration:none}section{padding:32px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}h1{margin:0 0 12px;font-size:32px;line-height:1.2;letter-spacing:-.025em}p{margin:0}.instructions{color:var(--muted)}.metric{margin-top:32px}.label{display:block;color:var(--muted);font-size:14px;font-weight:600}.count{display:block;margin-top:4px;font-size:80px;line-height:1.1;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.empty-state{margin-top:16px;color:var(--muted)}.actions{display:flex;gap:12px;margin-top:32px}button{min-height:48px;min-width:44px;padding:11px 20px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}button:hover{background:var(--soft)}button.primary:hover{background:var(--hover);border-color:var(--hover)}button:active{box-shadow:inset 0 0 0 2px var(--text)}:focus-visible{outline:3px solid var(--focus);outline-offset:4px}@media(max-width:480px){main{padding:24px 16px}section{padding:24px}.actions button{flex:1;padding-inline:12px}}@media(max-width:300px){.actions{flex-direction:column}}
</style>
</head>
<body>
<main id="counter">
<nav aria-label="Main navigation"><a href="#counter" aria-current="page">Counter</a></nav>
<section aria-labelledby="title">
<h1 id="title">Counter</h1>
<p class="instructions">Select Increment to add one. Select Reset to return to zero.</p>
<div class="metric"><span class="label" id="count-label">Count</span><span class="count" data-testid="count" aria-labelledby="count-label" aria-live="polite" aria-atomic="true">0</span></div>
<p class="empty-state">No increments yet.</p>
<div class="actions"><button type="button" class="primary">Increment</button><button type="button">Reset</button></div>
</section>
</main>
<script>
// Disposable interactive design prototype. The implementation in src is tested separately.
let previewCount = 0;
const previewValue = document.querySelector('[data-testid="count"]');
const previewEmpty = document.querySelector('.empty-state');
const previewButtons = document.querySelectorAll('.actions button');
function renderPreview(){previewValue.textContent=String(previewCount);previewEmpty.hidden=previewCount>0;}
previewButtons[0].addEventListener('click',()=>{previewCount+=1;renderPreview();});
previewButtons[1].addEventListener('click',()=>{previewCount=0;renderPreview();});
window.addEventListener('project-init-preview',()=>{previewCount=0;renderPreview();});
</script>
</body>
</html>
